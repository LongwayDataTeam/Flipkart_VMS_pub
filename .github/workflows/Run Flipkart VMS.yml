name: Run Private Repo Script

on:
  schedule:
    # 4:00 PM IST = 10:30 AM UTC
    - cron: '30 10 * * *'

    # 8:00 PM IST = 2:30 PM UTC
    - cron: '30 14 * * *'

  workflow_dispatch:

jobs:
  run-private-script:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT PUBLIC REPO
      # =====================================================

      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # =====================================================
      # SETUP PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =====================================================
      # SETUP CHROME
      # =====================================================

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # =====================================================
      # SETUP SSH ACCESS
      # =====================================================

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # =====================================================
      # CLONE PRIVATE REPO
      # =====================================================

      - name: Clone Private Repo
        run: |
          git clone git@github.com:LongwayDataTeam/Flipkart_VMS_pvt.git

      # =====================================================
      # INSTALL REQUIREMENTS
      # =====================================================

      - name: Install Dependencies
        run: |
          cd Flipkart_VMS_pvt
          pip install -r requirements.txt

      # =====================================================
      # RUN SCRIPT
      # =====================================================

      - name: Run Main Script
        env:
          FK_USERNAME: ${{ secrets.FK_USERNAME }}
          FK_PASSWORD: ${{ secrets.FK_PASSWORD }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

        run: |
          cd Flipkart_VMS_pvt
          python main.py
